# Comments start only between arguments.
set $fragment abc#not-a-comment; # comment
set $escaped one\;two\{three\ four;
set $joined prefix${name}_$other-suffix-$12;
set $quotes "a # b \"quoted\" $host ${uri} \\$literal";
set $single 'a\'b $name';
set $path /v1/123;
set $mixed 123abc;
set $delay 10ms;
set $size 5M;
set $decimal 12.5;
set $compound 1h30m;
set $html "<tag a=\"x\">&";
if ($request_method = POST) { return 403; }
if ($uri ~* "^/private/(.*)$") { return 404; }
location ~ "^/files/[0-9]{2}$" { return 200; }
include /etc/nginx/conf.d/*.conf;
