  <g-pb>(</g-pb><g-k>cond</g-k> <g-pb>((</g-pb><g-f>null?</g-f> <g-v>tree</g-v><g-pb>)</g-pb> <g-n>0</g-n><g-pb>)</g-pb>
        <g-pb>((</g-pb><g-f>pair?</g-f> <g-v>tree</g-v><g-pb>)</g-pb> <g-pb>(</g-pb><g-f>+</g-f> <g-pb>(</g-pb><g-f>leaf-count</g-f> <g-pb>(</g-pb><g-f>car</g-f> <g-v>tree</g-v><g-pb>))</g-pb>

       <g-pb>(</g-pb><g-f>total</g-f> <g-pb>(</g-pb><g-f>leaf-count</g-f> <g-v>tree</g-v><g-pb>)))</g-pb>
