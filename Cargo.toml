[package]
name = "glisten"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "rust/src/lib.rs"

[[test]]
name = "composition"
path = "rust/tests/composition.rs"

[[test]]
name = "host"
path = "rust/tests/host.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasmparser = "0.254"
wasmtime = { version = "48.0.2", default-features = false, features = [
  "anyhow",
  "cranelift",
  "parallel-compilation",
  "runtime",
] }

[dev-dependencies]
walkdir = "2"
wat = "1"
