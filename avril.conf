name: "glisten"
compilerOptions: { strict: true, noUncheckedIndexedAccess: true }
// Imports between top-level directories start at the repository root.
imports: { "#/": "./" }
tasks: {
  build: "avril run tools/build.ts"
  test: "avril test ."
  "test:update": "GLISTEN_UPDATE_SNAPSHOTS=1 avril task test"
  "check:types": "avril check --typescript=\"$(command -v avril-tsc)\" $(find . -name '*.ts' -not -path './dist/*' -not -path './.*' -not -path './languages/*/*/samples/*')"
  fmt: "oxfmt --write ."
  "fmt:check": "oxfmt --check ."
  check: { dependencies: ["check:types", "fmt:check", "test"] }
}
deps: ["jsr:@char/justin@^0.4.2"]
